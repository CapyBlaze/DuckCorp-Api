name: Deploy API

on:
    push:
        branches:
            - main

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci

            - name: Run ESLint
              run: npm run lint

            - name: Run tests
              run: npm test

    deploy:
        needs: test

        runs-on: ubuntu-latest

        environment:
            name: production

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Deploy SSH
              uses: appleboy/ssh-action@v1.2.0
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  script: |
                      cd /root/DuckCorp-Api
                      git pull origin main
                      npm install
                      npm run build
                      npx prisma migrate deploy
                      systemctl restart duckcorp_api
